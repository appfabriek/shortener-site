name: Publish template to dok domain
description: Push template files (HTML/CSS/JS/images) into a dok domain via publish token
inputs:
  host:
    description: Production hostname; staging.<host> and accept.<host> are derived
    required: true
  environments:
    description: Comma-separated, in order (staging, accept, production); a failure stops the rest
    required: false
    default: staging,accept,production
  token:
    description: Legacy dtt_ token; publishes to host only. Leave empty to use the job's GitHub ID token (permissions id-token write)
    required: false
    default: ""
  paths:
    description: Comma-separated globs relative to repo root
    required: false
    default: "css/**/*,js/**/*,images/**/*,fonts/**/*,**/*.html,manifest.json,browserconfig.xml,llms.txt,sitemap.xml,robots.txt"
  repo:
    description: owner/repo recorded on the domain
    required: false
    default: ${{ github.repository }}
  branch:
    description: Branch name
    required: false
    default: ${{ github.ref_name }}
  sha:
    description: Commit SHA
    required: false
    default: ${{ github.sha }}
  protocol:
    description: http or https
    required: false
    default: https
runs:
  using: composite
  steps:
    - name: Publish template snapshot
      shell: bash
      env:
        BVG_HOST: ${{ inputs.host }}
        BVG_TOKEN: ${{ inputs.token }}
        BVG_ENVIRONMENTS: ${{ inputs.environments }}
        BVG_PATHS: ${{ inputs.paths }}
        BVG_REPO: ${{ inputs.repo }}
        BVG_BRANCH: ${{ inputs.branch }}
        BVG_SHA: ${{ inputs.sha }}
        BVG_PROTOCOL: ${{ inputs.protocol }}
      run: bash "${{ github.action_path }}/publish.sh"
