name: Publish template to dok

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Production Domain rows only. staging.*/accept.* have no Domain.
          - host: geert.link
          - host: nm.nu
          # Not shorteners (yet): only the bare home, no admin shell (app.html),
          # and the Appfabriek icon from hosts/<host>/images/.
          - host: koek.in
            paths: index.html,css/bare.css,fonts/**/*,images/logo.png,images/apple-touch.png
          - host: dox.onl
            paths: index.html,css/bare.css,fonts/**/*,images/logo.png,images/apple-touch.png
          - host: knst.link
            paths: index.html,css/bare.css,fonts/**/*,images/logo.png,images/apple-touch.png
    name: Publish → ${{ matrix.host }}
    steps:
      - uses: actions/checkout@v4
      # Per-host brand assets: hosts/<host>/ is copied over the shared tree
      # (e.g. geert.link's own logo), so hosts sharing this template keep
      # their own mark.
      - name: Apply host overlay
        run: |
          if [ -d "hosts/${{ matrix.host }}" ]; then cp -R "hosts/${{ matrix.host }}/." . ; fi
          rm -rf hosts
      - name: Publish to ${{ matrix.host }}
        uses: ./.github/actions/publish-template
        with:
          host: ${{ matrix.host }}
          # Empty means the action's default set.
          paths: ${{ matrix.paths }}
          protocol: https
