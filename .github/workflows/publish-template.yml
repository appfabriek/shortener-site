name: Publish template to dok

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Production Domain rows only. staging.*/accept.* have no Domain.
          - env: production
            host: geert.link
            secret: BVG_TEMPLATE_TOKEN_GEERT_LINK
          - env: production
            host: nm.nu
            secret: BVG_TEMPLATE_TOKEN_NM_NU
    name: Publish → ${{ matrix.host }}
    steps:
      - uses: actions/checkout@v4
      # Per-host brand assets: hosts/<host>/ is copied over the shared tree
      # (e.g. geert.link's own logo), so hosts sharing this template keep
      # their own mark.
      - name: Apply host overlay
        run: |
          if [ -d "hosts/${{ matrix.host }}" ]; then cp -R "hosts/${{ matrix.host }}/." . ; fi
      - name: Publish to ${{ matrix.host }}
        uses: ./.github/actions/publish-template
        with:
          host: ${{ matrix.host }}
          token: ${{ secrets[matrix.secret] }}
          protocol: https
