<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  {{csrf_meta}}
  <title>geert.link: korte links van Geert Rozendom</title>
  <meta name="description" content="geert.link is het domein voor de korte links van Geert Rozendom. Kreeg je zo&#x27;n link en werkt hij niet? Mail dan naar support@geert.link.">
  <link rel="canonical" href="https://geert.link/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="geert.link">
  <meta property="og:title" content="geert.link: korte links van Geert Rozendom">
  <meta property="og:description" content="geert.link is het domein voor de korte links van Geert Rozendom. Kreeg je zo&#x27;n link en werkt hij niet? Mail dan naar support@geert.link.">
  <meta property="og:url" content="https://geert.link/">
  <meta property="og:locale" content="nl_NL">
  <meta property="og:image" content="https://geert.link/images/og.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="geert.link/… Korte links van Geert Rozendom.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="geert.link: korte links van Geert Rozendom">
  <meta name="twitter:description" content="geert.link is het domein voor de korte links van Geert Rozendom. Kreeg je zo&#x27;n link en werkt hij niet? Mail dan naar support@geert.link.">
  <meta name="twitter:image" content="https://geert.link/images/og.png">
  <meta name="twitter:image:alt" content="geert.link/… Korte links van Geert Rozendom.">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "@id": "https://geert.link/#website",
    "name": "geert.link",
    "url": "https://geert.link/",
    "description": "Korte links van Geert Rozendom.",
    "inLanguage": "nl",
    "publisher": {
      "@type": "Person",
      "name": "Geert Rozendom"
    }
  }
  </script>
  <link rel="stylesheet" href="/css/landing.css">
  <link rel="stylesheet" href="/css/links.css">
  <link rel="stylesheet" href="/css/bare.css">
  <link rel="icon" href="{{brand_logo}}">
  <!-- The brand logo falls back to /images/logo.png; no inline onerror, so a strict script-src allows it. -->
  <script nonce="{{csp_nonce}}">document.addEventListener("error", function (event) { var img = event.target; if (img.classList && img.classList.contains("brand-logo") && !img.dataset.fallback) { img.dataset.fallback = "1"; img.src = "/images/logo.png"; } }, true);</script>
</head>
<body data-role="{{user_role}}" style="--bare-dot:#111111">
  <header class="landing-nav admin-only">
    <a href="/" class="landing-brand">
      <img class="brand-logo" src="{{brand_logo}}" width="28" height="28" alt="" decoding="async">
      {{brand_name}}
    </a>
    <nav>
      <a href="/admin/links">Links</a>
      <a href="/admin/settings">Instellingen</a>
    </nav>
  </header>
  <!-- Link console (create form + recent links), injected by Rails (HomeController#index). -->
  <section class="console admin-only">
    {{content}}
  </section>
  <main class="bare guest-only">
    <h1>geert<span class="tld">.link</span><span class="rest">/…</span></h1>
    <p>Korte links van Geert Rozendom.</p>
    <p class="bare-note">Werkt een link niet? <a href="mailto:support@geert.link">Mail me</a>.</p>
    <p class="bare-note bare-admin"><a href="/session/new">Inloggen</a></p>
  </main>
  {{footer}}
  <p class="bare-p2tp"><a href="https://p2tp.org/">Continuïteit via Stichting p2tp (in oprichting)</a></p>
</body>
</html>
